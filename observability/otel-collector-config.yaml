# Configuración del OpenTelemetry Collector.
# Recibe OTLP del API y reparte MÉTRICAS -> Prometheus y TRAZAS -> Jaeger.
# Los LOGS ya NO pasan por aquí: los recoge Promtail desde el stdout del contenedor
# y los envía a Loki (alineado al laboratorio DMC).

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}
  # Añade metadatos útiles a todas las señales
  resourcedetection:
    detectors: [env, system]
    timeout: 5s

exporters:
  # MÉTRICAS -> endpoint Prometheus que el server de Prometheus scrapea (:8889)
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true   # convierte atributos de recurso (service.name, etc.) en labels

  # TRAZAS -> Jaeger (OTLP gRPC; Jaeger all-in-one con COLLECTOR_OTLP_ENABLED)
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # Útil para depurar lo que llega al collector (se ve en `docker logs otel-collector`)
  debug:
    verbosity: basic

service:
  telemetry:
    metrics:
      address: 0.0.0.0:8888   # métricas internas del propio collector
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [resourcedetection, batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [resourcedetection, batch]
      exporters: [otlp/jaeger, debug]
