name: observability

# Stack local de observabilidad (3 pilares) para el API solution-test-ventas.
# Alineado a las herramientas del laboratorio DMC (observabilidad-360): Jaeger + Loki/Promtail.
#
#   API .NET ──OTLP(4317)──► otel-collector ──► prometheus (métricas, scrape :8889)
#                                          └──► jaeger     (trazas, OTLP)
#   API .NET (stdout) ─────► promtail ─────────► loki      (logs)
#                                                  todo visualizado en grafana :3000
#
# El API se conecta desde su propio compose uniéndose a la red externa "observability"
# (ver ../docker-compose.observability.yml).

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.127.0
    container_name: otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC  (lo usa el API)
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Métricas de la app reexpuestas para Prometheus
    networks: [observability]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: obs-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
      - '--enable-feature=exemplar-storage'    # guarda exemplars (link métrica -> traza)
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks: [observability]
    restart: unless-stopped

  # TRAZAS: Jaeger all-in-one (como en el laboratorio DMC). Recibe OTLP del collector.
  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: obs-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true   # habilita el receptor OTLP (4317 gRPC / 4318 HTTP)
    ports:
      - "16686:16686"   # Jaeger UI
      # OTLP (4317/4318) NO se publica al host: lo consume el collector por la red interna
      # (el host :4317 ya lo usa el otel-collector).
    networks: [observability]
    restart: unless-stopped

  loki:
    image: grafana/loki:3.4.2
    container_name: obs-loki
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks: [observability]
    restart: unless-stopped

  # LOGS: Promtail lee el stdout de los contenedores vía el socket de Docker y los envía a Loki
  # (como en el laboratorio DMC). Reemplaza el envío de logs por OTLP.
  promtail:
    image: grafana/promtail:3.4.2
    container_name: obs-promtail
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]
    networks: [observability]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.15
    container_name: obs-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on: [prometheus, jaeger, loki]
    networks: [observability]
    restart: unless-stopped

  # Métricas de infraestructura del host (CPU/RAM/disco/red) — equivalente al lab
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: obs-node-exporter
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"
    networks: [observability]
    restart: unless-stopped

  # Enrutamiento/agrupación/silenciado de alertas — equivalente al lab
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: obs-alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "9093:9093"
    networks: [observability]
    restart: unless-stopped

networks:
  observability:
    name: observability
    driver: bridge

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
  alertmanager-data:
