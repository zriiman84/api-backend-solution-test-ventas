apiVersion: 1

datasources:
  # ---------- MÉTRICAS ----------
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      httpMethod: POST
      # Enlaza un exemplar de una métrica con su traza en Jaeger
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: jaeger

  # ---------- TRAZAS ----------
  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    jsonData:
      # Desde una traza, saltar a los logs correlacionados en Loki
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-1h'
        spanEndTimeShift: '1h'
        filterByTraceID: true
        tags: [{ key: 'service.name', value: 'service_name' }]

  # ---------- LOGS ----------
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # Desde un log (JSON con trace_id), saltar a la traza en Jaeger
      derivedFields:
        - name: TraceID
          matcherRegex: '"?trace_?id"?[:=]"?(\w+)"?'
          url: '${__value.raw}'
          datasourceUid: jaeger
          urlDisplayLabel: 'Ver traza'
