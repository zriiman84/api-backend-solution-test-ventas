# Promtail — recoge el stdout de los contenedores Docker y lo envía a Loki.
# Alineado al laboratorio DMC (observabilidad-360): logs por Promtail en vez de OTLP.

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # 1) Logs de TODOS los contenedores Docker (incluye el API .NET).
  #    Promtail descubre los contenedores vía el socket de Docker y lee su stdout.
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: stream
      # Etiqueta service_name para el contenedor del API (correlación con métricas/trazas).
      - source_labels: ['__meta_docker_container_name']
        regex: '/net-api-sales'
        target_label: service_name
        replacement: 'api-solution-test-ventas'

  # 2) Logs del sistema del host.
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          __path__: /var/log/*.log
